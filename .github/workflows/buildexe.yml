name: CI build exe

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # release job 需要写权限（原来只有 read）

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet -mod=vendor ./...
      - run: go test -mod=vendor ./...
      - run: go build -mod=vendor ./client ./server
      - name: Race test
        if: runner.os == 'Linux'
        run: go test -mod=vendor -race ./...

  cross-build:
    name: Cross-build release targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build client and server
        shell: bash
        run: |
          set -euo pipefail
          export CGO_ENABLED=0
          export GOMIPS=softfloat

          build_one() {
            local goos="$1" goarch="$2" goarm="${3:-}"
            local name="$goos-$goarch${goarm:+v$goarm}"
            local outdir="dist/$name"
            mkdir -p "$outdir"

            local ext=""
            [ "$goos" = "windows" ] && ext=".exe"

            echo "Building $name"
            GOOS="$goos" GOARCH="$goarch" GOARM="$goarm" \
              go build -mod=vendor -trimpath -ldflags="-s -w" \
              -o "$outdir/client$ext" ./client
            GOOS="$goos" GOARCH="$goarch" GOARM="$goarm" \
              go build -mod=vendor -trimpath -ldflags="-s -w" \
              -o "$outdir/server$ext" ./server

            ( cd "$outdir" && zip -q -r "../${name}.zip" . )
            rm -rf "$outdir"
          }

          for target in darwin/amd64 darwin/arm64 freebsd/amd64 \
            linux/386 linux/amd64 linux/arm64 linux/loong64 \
            linux/mips linux/mipsle windows/386 windows/amd64 windows/arm64; do
            build_one "${target%/*}" "${target#*/}"
          done
          for arm in 5 6 7; do
            build_one linux arm "$arm"
          done

          ls -lh dist/
      - name: Upload artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [test, cross-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
