name: CI build exe

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet -mod=vendor ./...
      - run: go test -mod=vendor ./...
      - run: go build -mod=vendor ./client ./server
      - name: Race test
        if: runner.os == 'Linux'
        run: go test -mod=vendor -race ./...

  cross-build:
    name: Cross-build release targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build client and server
        shell: bash
        run: |
          set -euo pipefail
          export CGO_ENABLED=0
          export GOMIPS=softfloat

          build_one() {
            local goos="$1" goarch="$2" goarm="${3:-}"
            local name="$goos-$goarch${goarm:+v$goarm}"
            local outdir="dist/$name"
            mkdir -p "$outdir"

            local ext=""
            [ "$goos" = "windows" ] && ext=".exe"

            echo "Building $name"
            GOOS="$goos" GOARCH="$goarch" GOARM="$goarm" \
              go build -mod=vendor -trimpath -ldflags="-s -w" \
              -o "$outdir/client$ext" ./client
            GOOS="$goos" GOARCH="$goarch" GOARM="$goarm" \
              go build -mod=vendor -trimpath -ldflags="-s -w" \
              -o "$outdir/server$ext" ./server

            ( cd "$outdir" && zip -q -r "../${name}.zip" . )
            rm -rf "$outdir"
          }

          for target in darwin/amd64 darwin/arm64 freebsd/amd64 \
            linux/386 linux/amd64 linux/arm64 linux/loong64 \
            linux/mips linux/mipsle windows/386 windows/amd64 windows/arm64; do
            build_one "${target%/*}" "${target#*/}"
          done
          for arm in 5 6 7; do
            build_one linux arm "$arm"
          done

          ls -lh dist/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Auto Tag & Release
    needs: [test, cross-build]
    # 只在 push 到默认分支时自动发布；PR 不发布
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist

      - name: Compute version (yyyymmdd-sn)
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y%m%d)

          # 查询当天已存在的 tag 数量（按前缀匹配分页取全）
          COUNT=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags" \
            --jq ".[] | select(.ref | startswith(\"refs/tags/${DATE}-\")) | .ref" \
            | wc -l | tr -d ' ')

          SN=$((COUNT + 1))
          VERSION="${DATE}-${SN}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Create tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${VERSION}" \
            -f sha="${GITHUB_SHA}"

      - name: Create Release & upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*.zip
