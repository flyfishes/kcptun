name: CIbuild

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet -mod=vendor ./...
      - run: go test -mod=vendor ./...
      - run: go build -mod=vendor ./client ./server
      - name: Race test
        if: runner.os == 'Linux'
        run: go test -mod=vendor -race ./...

  cross-build:
    name: Cross-build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            goos: linux
            goarch: amd64
            goarm: ""
          - platform: windows-amd64
            goos: windows
            goarch: amd64
            goarm: ""
          - platform: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"
          - platform: linux-arm64
            goos: linux
            goarch: arm64
            goarm: ""
          # ===== OpenWrt =====
          - platform: openwrt-amd64
            goos: linux
            goarch: amd64
            goarm: ""
          - platform: openwrt-aarch64
            goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          export CGO_ENABLED=0
          export GOMIPS=softfloat

          GOOS="${{ matrix.goos }}"
          GOARCH="${{ matrix.goarch }}"
          GOARM="${{ matrix.goarm }}"
          NAME="kcptun-${{ matrix.platform }}"
          OUTDIR="dist/$NAME"
          mkdir -p "$OUTDIR"

          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"

          echo "Building $NAME"
          GOOS="$GOOS" GOARCH="$GOARCH" GOARM="$GOARM" \
            go build -mod=vendor -trimpath -ldflags="-s -w" \
            -o "$OUTDIR/client$EXT" ./client
          GOOS="$GOOS" GOARCH="$GOARCH" GOARM="$GOARM" \
            go build -mod=vendor -trimpath -ldflags="-s -w" \
            -o "$OUTDIR/server$EXT" ./server

          ( cd "$OUTDIR" && zip -q -r "../${NAME}.zip" . )
          rm -rf "$OUTDIR"
          ls -lh "dist/${NAME}.zip"
      - name: Upload artifact ${{ matrix.platform }}
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: dist/kcptun-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    name: Auto Tag & Release
    needs: [test, cross-build]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bin-*
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: ls -lh artifacts/

      - name: Compute version (yyyymmdd-sn)
        id: version
        shell: bash
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y%m%d)

          PREFIX="refs/tags/${DATE}-"
          git ls-remote --tags --refs origin \
            | awk -v p="$PREFIX" '$2 ~ "^"p"[0-9]+$" {print $2}' \
            > /tmp/existing.txt || true

          COUNT=$(wc -l < /tmp/existing.txt | tr -d ' ')
          SN=$((COUNT + 1))
          VERSION="${DATE}-${SN}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION} (existing today: ${COUNT})"
          cat /tmp/existing.txt || true

      - name: Create tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${VERSION}" \
            -f sha="${GITHUB_SHA}"

      - name: Create Release & upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/kcptun-*.zip
