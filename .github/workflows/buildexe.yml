name: CIBuildExe

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet -mod=vendor ./...
      - run: go test -mod=vendor ./...
      - run: go build -mod=vendor ./client ./server
      - name: Race test
        if: runner.os == 'Linux'
        run: go test -mod=vendor -race ./...

  cross-build:
    name: Cross-build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin/amd64
          - target: darwin/arm64
          - target: freebsd/amd64
          - target: linux/amd64
          - target: linux/arm64
          - target: linux/arm/v7
          - target: windows/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          export CGO_ENABLED=0
          export GOMIPS=softfloat

          IFS='/' read -r GOOS GOARCH GOARM <<< "${{ matrix.target }}"
          GOARM="${GOARM:-}"

          NAME="$GOOS-$GOARCH${GOARM:+v$GOARM}"
          OUTDIR="dist/$NAME"
          mkdir -p "$OUTDIR"

          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"

          echo "Building $NAME"
          GOOS="$GOOS" GOARCH="$GOARCH" GOARM="$GOARM" \
            go build -mod=vendor -trimpath -ldflags="-s -w" \
            -o "$OUTDIR/client$EXT" ./client
          GOOS="$GOOS" GOARCH="$GOARCH" GOARM="$GOARM" \
            go build -mod=vendor -trimpath -ldflags="-s -w" \
            -o "$OUTDIR/server$EXT" ./server

          ( cd "$OUTDIR" && zip -q -r "../${NAME}.zip" . )
          rm -rf "$OUTDIR"
          ls -lh "dist/${NAME}.zip"
      - name: Upload artifact for ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ strategy.job-index }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Release ${{ matrix.target }}
    needs: [test, cross-build]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}-${{ matrix.platform }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin/amd64
            platform: darwin-amd64
          - target: darwin/arm64
            platform: darwin-arm64
          - target: freebsd/amd64
            platform: freebsd-amd64
          - target: linux/amd64
            platform: linux-amd64
          - target: linux/arm64
            platform: linux-arm64
          - target: linux/arm/v7
            platform: linux-armv7
          - target: windows/amd64
            platform: windows-amd64
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: bin-${{ strategy.job-index }}
          path: dist

      - name: Compute version (yyyymmdd-sn) for ${{ matrix.platform }}
        id: version
        shell: bash
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y%m%d)

          # 该平台当天已有 tag：形如 yyyymmdd-<platform>-<sn>
          PREFIX="refs/tags/${DATE}-${{ matrix.platform }}-"
          git ls-remote --tags --refs origin \
            | awk -v p="$PREFIX" '$2 ~ "^"p {print $2}' \
            > /tmp/existing.txt || true

          COUNT=$(wc -l < /tmp/existing.txt | tr -d ' ')
          SN=$((COUNT + 1))
          VERSION="${DATE}-${{ matrix.platform }}-${SN}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION} (existing today: ${COUNT})"
          cat /tmp/existing.txt || true

      - name: Create tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${VERSION}" \
            -f sha="${GITHUB_SHA}"

      - name: Create Release & upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*.zip
